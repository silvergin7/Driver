name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest
        run: npm test

      - name: Run TypeScript
        run: npm run typecheck

      - name: Build
        run: npm run build

  frontend-generated:
    name: Frontend generated files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate contract ABIs
        working-directory: frontend
        run: npm run generate

      - name: Deploy to Anvil
        working-directory: contracts
        run: |
          anvil --host 127.0.0.1 --port 8545 >/tmp/anvil.log 2>&1 &
          ready=0
          for _ in $(seq 1 30); do
            if cast block-number --rpc-url http://127.0.0.1:8545; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/anvil.log
            exit 1
          fi
          forge script script/DeployDriverToken.s.sol:DeployDriverToken --rpc-url http://127.0.0.1:8545 --broadcast --unlocked --sender 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266

      - name: Sync Anvil addresses
        working-directory: frontend
        run: npm run sync:anvil

      - name: Check generated files
        run: git diff --exit-code -- frontend/src/generated frontend/src/config/addresses.json

  slither:
    name: Slither
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Slither
        run: python -m pip install slither-analyzer==0.11.6

      - name: Show Slither version
        run: |
          forge --version
          slither --version
          python -m pip show crytic-compile | awk '/^Version:/{print "crytic-compile " $2}'

      - name: Run Slither
        run: |
          set +e
          slither . --json "$RUNNER_TEMP/slither.json"
          scan_exit=$?
          set -e

          if [[ ! -f "$RUNNER_TEMP/slither.json" ]]; then
            echo "Slither JSON is missing"
            exit 1
          fi
          if ! jq -e '.success == true and .error == null' "$RUNNER_TEMP/slither.json" >/dev/null; then
            echo "Slither scan is incomplete"
            jq -c '{success, error}' "$RUNNER_TEMP/slither.json" || true
            exit 1
          fi

          set +e
          # contract-summary is logged on stderr
          slither . --print contract-summary > "$RUNNER_TEMP/contract-summary.txt" 2>&1
          set -e

          missing=0
          count=0
          while IFS= read -r name; do
            [[ -z "$name" ]] && continue
            count=$((count + 1))
            if ! grep -Eq "\\+ Contract ${name}( |$)" "$RUNNER_TEMP/contract-summary.txt"; then
              echo "contract-summary is missing ${name}"
              missing=1
            fi
          done < <(grep -rhE --include='*.sol' '^[[:space:]]*(abstract[[:space:]]+)?(contract|interface|library)[[:space:]]+[A-Za-z_][A-Za-z0-9_]*' src | sed -E 's/.*(contract|interface|library)[[:space:]]+([A-Za-z_][A-Za-z0-9_]*).*/\2/')

          if [[ "$count" -eq 0 || "$missing" -ne 0 ]]; then
            echo "Declared in src: ${count}"
            exit 1
          fi

          if [[ "$scan_exit" -ne 0 ]]; then
            echo "Slither exit ${scan_exit}: Medium or High finding"
            exit "$scan_exit"
          fi

      - name: Write Slither summary
        if: always()
        run: |
          {
            echo "## Slither"
            if [[ ! -f "$RUNNER_TEMP/slither.json" ]]; then
              echo "No JSON report."
              exit 0
            fi
            jq -r '
              "success=\(.success) error=\(.error // "null")",
              ((.results.detectors // [])[]
                | . as $d
                | ($d.elements[0].source_mapping // {}) as $m
                | "- \($d.impact) \($d.check) \($m.filename_short // "unknown")#\($m.lines[0] // "?")")
            ' "$RUNNER_TEMP/slither.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Slither JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slither
          path: ${{ runner.temp }}/slither.json
          if-no-files-found: warn
