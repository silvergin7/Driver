[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
auto_detect_solc = false

[invariant]
fail_on_revert = true

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

